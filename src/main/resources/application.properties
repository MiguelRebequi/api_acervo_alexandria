spring.application.name=api_acervo_alexandria
# Conex\u00E3o com o Banco de Dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acervo_alexandria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Hibernate / JPA
# O modo 'update' cria e atualiza as tabelas automaticamente baseado nas suas classes Model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Essa senha ser\u00E1 substitu\u00EDda por uma vari\u00E1vel de ambiente do sistema operacional
api.security.token.secret=${JWT_SECRET:alexandria_super_secreta_123}

# Desativando o Open Session In View
spring.jpa.open-in-view=false

# Atraso na inicializa\u00E7\u00E3o para criar tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always