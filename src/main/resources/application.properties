spring.application.name=api_acervo_alexandria
# Conexão com o Banco de Dados
spring.datasource.url=jdbc:postgresql://192.168.56.101:5432/acervo_alexandria
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate / JPA
# O modo 'update' cria e atualiza as tabelas automaticamente baseado nas suas classes Model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Essa senha será substituída por uma variável de ambiente do sistema operacional
api.security.token.secret=alexandria_super_secreta_123